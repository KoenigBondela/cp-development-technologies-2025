<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head th:replace="~{fragments/layout :: head('Админ-панель')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <h1 class="h4 mb-4">Панель администратора</h1>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Номера</h2>
                    <p class="text-muted">CRUD для таблицы rooms</p>
                    <a class="btn btn-primary" th:href="@{/admin/rooms}">Управление номерами</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Пользователи</h2>
                    <p class="text-muted">CRUD + мягкое удаление (флаг deleted)</p>
                    <a class="btn btn-primary" th:href="@{/admin/users}">Управление пользователями</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
