<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Номера')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Номера (CRUD)</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin}">Назад</a>
    </div>

    <div th:if="${createError}" class="alert alert-danger" th:text="${createError}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">Добавить номер (id генерируется автоматически)</div>
        <div class="card-body">
            <form th:action="@{/admin/rooms}" method="post" th:object="${roomForm}" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-2">
                    <label class="form-label">Номер</label>
                    <input class="form-control" th:field="*{roomNumber}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Тип</label>
                    <input class="form-control" th:field="*{roomType}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Цена</label>
                    <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{pricePerNight}" required>
                </div>
                <div class="col-md-2">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" th:field="*{available}" id="availNew">
                        <label class="form-check-label" for="availNew">Свободен</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive card shadow-sm">
        <table class="table table-striped table-hover table-bordered align-middle mb-0">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Номер</th>
                <th>Тип</th>
                <th>Цена</th>
                <th>Свободен</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rooms}">
                <td th:text="${r.id}">1</td>
                <td th:text="${r.roomNumber}">101</td>
                <td th:text="${r.roomType}">Std</td>
                <td th:text="${r.pricePerNight}">50</td>
                <td th:text="${r.isAvailable} ? 'Да' : 'Нет'">Да</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/rooms/{id}/edit(id=${r.id})}">Редактировать</a>
                    <form th:action="@{/admin/rooms/{id}/delete(id=${r.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Удалить номер?');">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
