<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Редактирование пользователя')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container col-md-6">
    <h1 class="h4 mb-3">Редактирование пользователя #<span th:text="${userId}">1</span></h1>
    <div th:if="${updateError}" class="alert alert-warning" th:text="${updateError}"></div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/users/{id}(id=${userId})}" method="post" th:object="${userForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input class="form-control" th:field="*{username}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input class="form-control" type="password" th:field="*{password}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Роль</label>
                    <select class="form-select" th:field="*{role}">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a class="btn btn-secondary" th:href="@{/admin/users}">Отмена</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
