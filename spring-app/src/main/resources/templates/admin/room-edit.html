<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Редактирование номера')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container col-md-6">
    <h1 class="h4 mb-3">Редактирование номера #<span th:text="${roomId}">1</span></h1>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/rooms/{id}(id=${roomId})}" method="post" th:object="${roomForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Номер</label>
                    <input class="form-control" th:field="*{roomNumber}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Тип</label>
                    <input class="form-control" th:field="*{roomType}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Цена</label>
                    <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{pricePerNight}" required>
                </div>
                <div class="mb-3 form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{available}" id="availEdit">
                    <label class="form-check-label" for="availEdit">Свободен</label>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a class="btn btn-secondary" th:href="@{/admin/rooms}">Отмена</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
