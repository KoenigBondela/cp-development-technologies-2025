<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Пользователи')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Пользователи (CRUD, soft delete)</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin}">Назад</a>
    </div>

    <div th:if="${createError}" class="alert alert-warning" th:text="${createError}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">Добавить пользователя (id генерируется автоматически)</div>
        <div class="card-body">
            <form th:action="@{/admin/users}" method="post" th:object="${userForm}" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-3">
                    <label class="form-label">Имя</label>
                    <input class="form-control" th:field="*{username}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Пароль</label>
                    <input class="form-control" type="password" th:field="*{password}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Роль</label>
                    <select class="form-select" th:field="*{role}">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive card shadow-sm">
        <table class="table table-striped table-hover table-bordered align-middle mb-0">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Роль</th>
                <th>Создан</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.username}">user</td>
                <td th:text="${u.role}">USER</td>
                <td th:text="${u.createdAt}">—</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Редактировать</a>
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Пометить пользователя как удалённого?');">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted small">Удаление только выставляет флаг <code>deleted=1</code>, запись в MySQL остаётся.</p>
</div>
</body>
</html>
