<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Профиль')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container col-md-5">
    <h1 class="h4 mb-3">Редактирование профиля</h1>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/profile/edit}" method="post" th:object="${userForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input class="form-control" th:field="*{username}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Новый пароль</label>
                    <input class="form-control" type="password" th:field="*{password}" required>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a class="btn btn-secondary" th:href="@{/welcome/user}">Отмена</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
