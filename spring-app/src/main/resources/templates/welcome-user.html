<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head th:replace="~{fragments/layout :: head('Welcome')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container">
    <h1 class="h4 mb-3">Добро пожаловать, <span sec:authentication="name">user</span>!</h1>

    <div class="table-responsive card shadow-sm">
        <table class="table table-striped table-bordered align-middle mb-0">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Роль</th>
                <th>Создан</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${me != null}">
                <td th:text="${me.id}">1</td>
                <td th:text="${me.username}">user</td>
                <td th:text="${me.role}">USER</td>
                <td th:text="${me.createdAt}">—</td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/profile/edit}">Редактировать</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
