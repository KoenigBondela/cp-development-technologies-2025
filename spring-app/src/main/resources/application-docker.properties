# Профиль docker (Лаб9): MySQL в контейнере mysql, переменные из docker-compose
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:hotel_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hotel_pass}

# Дать MySQL время подняться после healthcheck
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-timeout=60000

server.port=8081
spring.thymeleaf.cache=true
