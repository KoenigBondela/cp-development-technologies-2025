<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Лётная книжка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="pl-app">
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark pl-navbar mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/welcome}">
            <i class="bi bi-airplane-fill"></i>
            <span>Лётная книжка</span>
        </a>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="text-white-50 small d-none d-md-inline"
                  sec:authorize="isAuthenticated()"
                  sec:authentication="name"></span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/flights}" sec:authorize="hasRole('PILOT')">
                <i class="bi bi-journal-text"></i> Мои полёты
            </a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/statistics}" sec:authorize="hasRole('PILOT')">
                <i class="bi bi-bar-chart"></i> Статистика
            </a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/profile}" sec:authorize="hasRole('PILOT')">
                <i class="bi bi-person"></i> Профиль
            </a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/chief}" sec:authorize="hasRole('CHIEF')">
                <i class="bi bi-people"></i> Пилоты
            </a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/chief/catalog}" sec:authorize="hasRole('CHIEF')">
                <i class="bi bi-list-ul"></i> Справочники
            </a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </button>
            </form>
        </div>
    </div>
</nav>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
