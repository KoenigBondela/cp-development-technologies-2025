<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Мой профиль')}"></head>
<body class="pl-app">
<div th:replace="~{fragments/layout :: nav}"></div>
<div class="container col-lg-8 pb-5">
    <h1 class="h4 fw-bold mb-3">Мой профиль</h1>
    <div th:if="${param.saved}" class="alert alert-success">Данные сохранены.</div>
    <div th:if="${param.passwordChanged}" class="alert alert-success">Пароль изменён.</div>
    <div th:if="${passwordError}" class="alert alert-danger" th:text="${passwordError}"></div>

    <div class="card pl-card mb-4">
        <div class="card-header">Личные данные</div>
        <div class="card-body">
            <form th:action="@{/profile}" method="post" th:object="${profileForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">ФИО</label>
                        <input class="form-control" th:field="*{fullName}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Логин</label>
                        <input class="form-control" th:field="*{username}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Номер удостоверения</label>
                        <input class="form-control" th:field="*{licenseNumber}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Телефон</label>
                        <input class="form-control" th:field="*{phone}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>
                        <input class="form-control" type="email" th:field="*{email}">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary pl-btn-primary mt-3">Сохранить</button>
            </form>
        </div>
    </div>

    <div class="card pl-card">
        <div class="card-header">Сменить пароль</div>
        <div class="card-body">
            <form th:action="@{/profile/password}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-6">
                    <label class="form-label">Новый пароль</label>
                    <input class="form-control" type="password" name="newPassword" required minlength="4">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Повторите пароль</label>
                    <input class="form-control" type="password" name="newPasswordConfirm" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-outline-primary">Обновить пароль</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
