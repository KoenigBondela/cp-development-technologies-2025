<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Регистрация пилота')}"></head>
<body class="pl-app">
<div class="pl-auth-wrap">
    <div class="pl-auth-card" style="max-width: 520px;">
        <h1 class="h4 fw-bold mb-1">Регистрация пилота</h1>
        <p class="text-muted small mb-4">Создайте учётную запись для ведения лётной книжки</p>
        <div th:if="${#fields.hasErrors('registerForm.*')}" class="alert alert-danger py-2 small">
            Проверьте правильность заполнения полей.
        </div>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2"
             th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        <form th:action="@{/register}" method="post" th:object="${registerForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">ФИО</label>
                    <input class="form-control" th:field="*{fullName}" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Логин</label>
                    <input class="form-control" th:field="*{username}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Номер удостоверения</label>
                    <input class="form-control" th:field="*{licenseNumber}" placeholder="Необязательно">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Телефон</label>
                    <input class="form-control" th:field="*{phone}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input class="form-control" type="email" th:field="*{email}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Пароль</label>
                    <input class="form-control" type="password" th:field="*{password}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Повтор пароля</label>
                    <input class="form-control" type="password" th:field="*{passwordConfirm}" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary pl-btn-primary w-100 mt-4">Зарегистрироваться</button>
        </form>
        <p class="text-center mt-3 mb-0 small"><a th:href="@{/login}">Уже есть аккаунт — войти</a></p>
    </div>
</div>
</body>
</html>
