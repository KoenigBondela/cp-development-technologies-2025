# sessionVariables — utf8mb4 на каждое соединение (в т.ч. при INSERT заметок)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:pilot_logbook}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&connectionCollation=utf8mb4_unicode_ci&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pilot_pass}

spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-timeout=60000

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
server.tomcat.uri-encoding=UTF-8

spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

server.port=8082
spring.thymeleaf.cache=true
